[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "A lightweight algorithm capability factory for tabular machine learning"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.5,<2.6",
    "pandas>=3.0,<3.1",
    "scipy>=1.18,<1.19",
    "scikit-learn>=1.9,<2.0",
    "pydantic>=2.12,<3.0",
    "networkx>=3.5,<4.0",
    "openai>=3.3,<4.0",
    "python-dotenv>=1.2,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0,<10.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
