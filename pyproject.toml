[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "A lightweight algorithm capability factory for tabular machine learning"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

